name: One-time Flight Physics Backfill (May 1 - today)

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R_LIBS_USER: packrat/lib-R

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.4.0'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          libfontconfig1-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          libfreetype6-dev \
          libpng-dev \
          libjpeg-dev \
          libtiff-dev \
          libfontconfig1 \
          libxcb1 \
          libicu-dev \
          libcairo2-dev \
          libgdal-dev \
          libgeos-dev \
          libproj-dev \
          libudunits2-dev \
          librsvg2-dev

    - name: Write .Renviron
      run: |
        cat > .Renviron <<'EOF'
        TEAM_CODE=PCU
        PITCH_DATA_BACKEND=postgres
        PITCH_DATA_DB_URL=${{ secrets.PITCH_DATA_DB_URL }}
        EOF

    - name: Ensure Packrat library path
      run: mkdir -p packrat/lib-R

    - name: Cache Packrat library
      uses: actions/cache@v4
      with:
        path: packrat/lib-R
        key: ${{ runner.os }}-r-packrat-${{ hashFiles('packrat/packrat.lock') }}
        restore-keys: |
          ${{ runner.os }}-r-packrat-

    - name: Install R packages
      env:
        R_LIBS_USER: packrat/lib-R
      run: Rscript install_packages.R

    - name: Backfill flight physics columns (May 1 - today)
      env:
        R_LIBS_USER: packrat/lib-R
      run: Rscript backfill_flight_physics_may_to_today.R
