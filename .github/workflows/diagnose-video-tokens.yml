name: Diagnose Video Tokens (temporary, read-only)

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'TrackMan session_id to inspect'
        required: true
        default: '6f4d67db-c3b1-42b6-97ba-38ab8b949c1d'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: packrat/lib-R
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install R packages
        run: Rscript -e "install.packages(c('httr2','jsonlite','glue'), repos='https://cloud.r-project.org')"

      - name: Run diagnostic (read-only, no writes)
        env:
          TM_CLIENT_ID: ${{ secrets.TM_CLIENT_ID }}
          TM_CLIENT_SECRET: ${{ secrets.TM_CLIENT_SECRET }}
        run: Rscript diagnose_video_tokens.R "${{ inputs.session_id }}"
